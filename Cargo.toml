[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/auth",
    "crates/policy",
    "crates/store",
    "crates/connections",
    "crates/api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jcuffney/iam"

[workspace.dependencies]
iam-core = { path = "crates/core" }
iam-auth = { path = "crates/auth" }
iam-policy = { path = "crates/policy" }
iam-store = { path = "crates/store" }
iam-connections = { path = "crates/connections" }

# core-permitted dependencies
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

serde_json = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# =0.8.6: must match the installed sqlx-cli for .sqlx offline data; 0.9 upgrade is a deliberate later change
sqlx = { version = "=0.8.6", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "time",
    "migrate",
    "macros",
] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"

# exact pins: webauthn-rs internally pins its -core/-proto crates per patch version,
# and the softpasskey test authenticator must resolve to the same proto types
webauthn-rs = { version = "=0.5.5", features = [
    "danger-allow-state-serialisation",
    "danger-credential-internals",
] }
webauthn-authenticator-rs = { version = "=0.5.5", features = ["softpasskey"] }

# v11 ships no crypto backend by default; exactly one must be enabled
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
argon2 = "0.6"
aes-gcm = "0.10"
governor = "0.10"
lambda_http = "1.3"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
ed25519-dalek = { version = "2.1", features = ["pkcs8"] }
getrandom = "0.3"
base64 = "0.23"
url = "2.5"
dotenvy = "0.15"
http-body-util = "0.1"

[profile.dev.package.argon2]
# argon2 is intentionally slow; keep dev/test hashing tolerable
opt-level = 3
